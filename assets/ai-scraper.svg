<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" />
  <rect x="1.5" y="1.5" width="797" height="447" rx="16" fill="none" stroke="#374151" stroke-width="2" />

  <!-- Subtle neural web network grid -->
  <g opacity="0.12" stroke="#a78bfa" stroke-width="1">
    <line x1="100" y1="50" x2="300" y2="150" />
    <line x1="300" y1="150" x2="250" y2="350" />
    <line x1="250" y1="350" x2="450" y2="280" />
    <line x1="450" y1="280" x2="600" y2="380" />
    <line x1="600" y1="380" x2="700" y2="200" />
    <line x1="700" y1="200" x2="520" y2="100" />
    <line x1="520" y1="100" x2="300" y2="150" />
  </g>

  <!-- Top bar badge -->
  <rect x="40" y="36" width="165" height="28" rx="14" fill="#6d28d9" fill-opacity="0.25" stroke="#7c3aed" stroke-width="1" />
  <circle cx="56" cy="50" r="5" fill="#a78bfa" />
  <text x="70" y="55" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">AI AUTOMATION &amp; SCRAPER</text>

  <!-- Main Title -->
  <text x="40" y="115" fill="#f9fafb" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">SchemeSathi AI Scraper</text>
  <text x="40" y="145" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="16">Indian Government Scheme Discovery &amp; Automated Tracking Platform</text>

  <!-- Tech tags -->
  <g transform="translate(40, 175)">
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="45" y="17" fill="#e5e7eb" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="100" y="0" width="75" height="26" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="137" y="17" fill="#e5e7eb" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Next.js</text>

    <rect x="185" y="0" width="105" height="26" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="237" y="17" fill="#e5e7eb" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">AI Intelligence</text>

    <rect x="300" y="0" width="105" height="26" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="352" y="17" fill="#e5e7eb" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Web Scraping</text>
  </g>

  <!-- Interactive Terminal/Result preview card -->
  <rect x="40" y="225" width="460" height="185" rx="12" fill="url(#cardGrad2)" stroke="#374151" stroke-width="1.5" />
  
  <!-- Terminal window header -->
  <circle cx="58" cy="243" r="4" fill="#ef4444" />
  <circle cx="72" cy="243" r="4" fill="#f59e0b" />
  <circle cx="86" cy="243" r="4" fill="#10b981" />
  <text x="105" y="247" fill="#9ca3af" font-family="monospace" font-size="11">schemesathi-crawler — auto-tracking</text>

  <!-- Scheme card mock items -->
  <g transform="translate(55, 265)">
    <rect x="0" y="0" width="430" height="38" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="36" y="18" fill="#f3f4f6" font-family="sans-serif" font-size="12" font-weight="600">PM Kisan Samman Nidhi &amp; Subsidies</text>
    <text x="36" y="30" fill="#9ca3af" font-family="sans-serif" font-size="10">Status: Verified • Updated 2h ago • Ministry of Agriculture</text>
    <rect x="340" y="9" width="75" height="20" rx="4" fill="#065f46" />
    <text x="377" y="23" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">MATCH: 98%</text>
  </g>

  <g transform="translate(55, 312)">
    <rect x="0" y="0" width="430" height="38" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#3b82f6" />
    <text x="36" y="18" fill="#f3f4f6" font-family="sans-serif" font-size="12" font-weight="600">National Scholarship Portal (NSP 2026)</text>
    <text x="36" y="30" fill="#9ca3af" font-family="sans-serif" font-size="10">Status: Live Crawled • Eligibility: MCA / B.Sc Students</text>
    <rect x="340" y="9" width="75" height="20" rx="4" fill="#1e3a8a" />
    <text x="377" y="23" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">MATCH: 94%</text>
  </g>

  <g transform="translate(55, 360)">
    <rect x="0" y="0" width="430" height="38" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#8b5cf6" />
    <text x="36" y="18" fill="#f3f4f6" font-family="sans-serif" font-size="12" font-weight="600">Startup India Seed Fund Scheme</text>
    <text x="36" y="30" fill="#9ca3af" font-family="sans-serif" font-size="10">Status: Real-time Monitor • Ministry of Commerce &amp; Industry</text>
    <rect x="340" y="9" width="75" height="20" rx="4" fill="#4c1d95" />
    <text x="377" y="23" fill="#c4b5fd" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Play / Video badge overlay on right -->
  <g transform="translate(560, 160)">
    <circle cx="80" cy="80" r="64" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" />
    <circle cx="80" cy="80" r="46" fill="url(#purpleGrad)" filter="url(#glowPurple)" />
    <polygon points="73,63 73,97 97,80" fill="#ffffff" />
    <text x="80" y="165" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Project Video Preview</text>
    <text x="80" y="185" fill="#9ca3af" font-family="sans-serif" font-size="12" text-anchor="middle">assets/ai-scraper.mp4</text>
  </g>
</svg>

