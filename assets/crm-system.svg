<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="797" height="447" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Subtle grid pattern -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Top bar badge -->
  <rect x="40" y="36" width="130" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
  <circle cx="56" cy="50" r="5" fill="#38bdf8" />
  <text x="70" y="55" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CRM PLATFORM</text>

  <!-- Main Title -->
  <text x="40" y="115" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">StorePulse CRM System</text>
  <text x="40" y="145" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16">Omni-Retail Operations &amp; Intelligent Store POS</text>

  <!-- Tech tags -->
  <g transform="translate(40, 175)">
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="45" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>

    <rect x="100" y="0" width="75" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="137" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Next.js</text>

    <rect x="185" y="0" width="80" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="225" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Full Stack</text>

    <rect x="275" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="317" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- Preview Card Graphic -->
  <rect x="40" y="225" width="460" height="185" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Mini dashboard mock -->
  <rect x="60" y="245" width="125" height="45" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="75" y="263" fill="#64748b" font-family="sans-serif" font-size="10">TOTAL REVENUE</text>
  <text x="75" y="281" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="700">₹ 8,42,500</text>

  <rect x="195" y="245" width="125" height="45" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="210" y="263" fill="#64748b" font-family="sans-serif" font-size="10">ACTIVE ORDERS</text>
  <text x="210" y="281" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="700">1,248 Orders</text>

  <rect x="330" y="245" width="150" height="45" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="345" y="263" fill="#64748b" font-family="sans-serif" font-size="10">STORE INVENTORY</text>
  <text x="345" y="281" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="700">3,890 In Stock</text>

  <!-- Bar chart mock -->
  <g transform="translate(60, 310)">
    <rect x="0" y="45" width="22" height="40" rx="3" fill="#0284c7" />
    <rect x="32" y="30" width="22" height="55" rx="3" fill="#0284c7" />
    <rect x="64" y="20" width="22" height="65" rx="3" fill="#38bdf8" />
    <rect x="96" y="38" width="22" height="47" rx="3" fill="#0284c7" />
    <rect x="128" y="10" width="22" height="75" rx="3" fill="#38bdf8" />
    <rect x="160" y="25" width="22" height="60" rx="3" fill="#0284c7" />
    <rect x="192" y="15" width="22" height="70" rx="3" fill="#38bdf8" />
    <rect x="224" y="32" width="22" height="53" rx="3" fill="#0284c7" />
    <rect x="256" y="5" width="22" height="80" rx="3" fill="url(#accentGrad)" filter="url(#glow)" />
    <rect x="288" y="28" width="22" height="57" rx="3" fill="#0284c7" />
    <rect x="320" y="18" width="22" height="67" rx="3" fill="#38bdf8" />
    <rect x="352" y="8" width="22" height="77" rx="3" fill="url(#accentGrad)" />
    <rect x="384" y="22" width="22" height="63" rx="3" fill="#0284c7" />
  </g>

  <!-- Play / Video badge overlay on right -->
  <g transform="translate(560, 160)">
    <circle cx="80" cy="80" r="64" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4" />
    <circle cx="80" cy="80" r="46" fill="url(#accentGrad)" filter="url(#glow)" />
    <polygon points="73,63 73,97 97,80" fill="#ffffff" />
    <text x="80" y="165" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Project Video Preview</text>
    <text x="80" y="185" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">assets/crm-system.mp4</text>
  </g>
</svg>

